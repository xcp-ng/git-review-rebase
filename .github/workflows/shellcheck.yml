name: shellcheck

on:
  push:
    branches:
      - 'main'
    paths:
      - 'scripts/*.sh'
      - 'scripts/git-import-srpm'
      - 'docker/riscv/**/*.sh'
  pull_request:
    paths:
      - 'scripts/*.sh'
      - 'scripts/git-import-srpm'
      - 'docker/riscv/**/*.sh'

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: shellcheck scripts/*.sh scripts/git-import-srpm
