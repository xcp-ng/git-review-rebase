name: Static code checkers - kabi

on:
  push:
    branches:
      - 'main'
    paths:
      - 'scripts/kabi/**'
  pull_request:
    paths:
      - 'scripts/kabi/**'

permissions: {}

jobs:
  kabi-code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-code-check/
        with:
          working-directory: scripts/kabi
