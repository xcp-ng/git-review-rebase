name: Static code checkers - kabi

on:
  push:
    branches:
      - 'main'
    paths:
      - 'scripts/kabi/**'
  pull_request:
    paths:
      - 'scripts/kabi/**'

permissions: {}

jobs:
  kabi-code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/python-code-check/
        with:
          working-directory: scripts/kabi
