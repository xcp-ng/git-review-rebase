name: Check requirements file consistency - git-review-rebase

on:
  push:
    branches:
      - 'main'
    paths:
      - 'scripts/git-review-rebase/**'
      - 'scripts/update_requirements.py'
  pull_request:
    paths:
      - 'scripts/git-review-rebase/**'
      - 'scripts/update_requirements.py'

permissions: {}

jobs:
  requirements-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-requirements-check/
        with:
          working-directory: scripts/git-review-rebase
