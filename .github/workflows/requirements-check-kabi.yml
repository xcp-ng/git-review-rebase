name: Check requirements file consistency - kabi

on:
  push:
    branches:
      - 'main'
    paths:
      - 'scripts/kabi/**'
      - 'scripts/update_requirements.py'
  pull_request:
    paths:
      - 'scripts/kabi/**'
      - 'scripts/update_requirements.py'

permissions: {}

jobs:
  requirements-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-requirements-check/
        with:
          working-directory: scripts/kabi
