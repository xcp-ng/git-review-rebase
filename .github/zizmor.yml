# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# update-driver-submodules.yml intentionally persists the GITHUB_TOKEN on
# checkout (see the "persist credentials in order to pull/push" change): its
# "Commit and open PR" step runs `git push --force origin` and needs those
# credentials. The workflow uploads no artifacts, so the artipacked
# credential-leak vector (token exposure via uploaded artifacts) does not
# apply here. Scope the ignore to that one file rather than disabling the audit.
rules:
  artipacked:
    ignore:
      - update-driver-submodules.yml
